<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>{% block title %}Doosan M0609 Drawing Admin{% endblock %}</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body>
  <div class="layout">
    <aside class="sidebar">
      <div>
        <div class="logo-sub">Doosan M0609</div>
        <div class="logo-title">Drawing Admin</div>
      </div>

      <nav class="nav">
        <a
          class="nav-link {% if request.endpoint == 'admin.dashboard' %}active{% endif %}"
          href="{{ url_for('admin.dashboard') }}"
        >
          대시보드
        </a>

        <a
          class="nav-link {% if request.endpoint in ['admin.request_list', 'admin.request_detail'] %}active{% endif %}"
          href="{{ url_for('admin.request_list') }}"
        >
          요청 목록
        </a>

        <a
          class="nav-link"
          href="{{ url_for('admin.dashboard') }}"
          title="현재는 대시보드에서 현재 작업을 확인합니다."
        >
          로봇 작업 관리
        </a>

        <a
          class="nav-link"
          href="{{ url_for('admin.request_list') }}"
          title="현재는 요청 목록에서 작업 이력을 확인합니다."
        >
          작업 로그
        </a>

        <a
          class="nav-link"
          href="{{ url_for('admin.dashboard') }}"
          title="설정 페이지는 추후 추가 예정입니다."
        >
          설정
        </a>
      </nav>

      <div class="admin-card">
        <div class="admin-name">관리자</div>
        <div class="admin-email">robot-admin@project.com</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="page-label">{% block page_label %}관리자 페이지{% endblock %}</div>
          <div class="page-title">{% block page_title %}대시보드{% endblock %}</div>
        </div>

        <div class="top-actions">
          <div
            id="robotConnectionBadge"
            class="connected-badge badge-waiting"
          >
            ● 수신 대기
          </div>

          <button class="refresh-btn" type="button" onclick="location.reload()">
            새로고침
          </button>
        </div>
      </header>

      <section class="content">
        {% block content %}{% endblock %}
      </section>
    </main>
  </div>

  <script>
    window.DASHBOARD_REFRESH_INTERVAL_MS = {{ refresh_interval_ms | default(1000) }};
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
